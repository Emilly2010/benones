<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Cadastro de Livro</title>

  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
  </style>
</head>

<body>

  <h1>Cadastro de Livro</h1>

  <form id="formLivro">

    <label>ID do Livro:</label>
    <input type="number" id="id_livro" name="id_livro">

    <br><br>

    <label>Título:</label>
    <input type="text" id="titulo" name="titulo">

    <br><br>

    <label>Editora:</label>
    <input type="text" id="editora" name="editora">

    <br><br>

    <label>Ano de Publicação:</label>
    <input type="date" id="ano_publicado" name="ano_publicado">

    <br><br>

    <label>Categoria:</label>
    <input type="text" id="categoria" name="categoria">

    <br><br>

    <button type="submit">Cadastrar</button>

  </form>

  <div id="message"></div>

  <script src="criarInformacaoLivro.js"></script>

</body>

</html>
