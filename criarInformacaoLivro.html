<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Informações de Livros</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
    </style>
</head>

<body>
    <h1>Informações do Livro:</h1>
    <form id="formInformaçãoLivro">
        <label>Título:</label>
        <input type="text" id="titulo" name="titulo">
        <br><br>
        <label>Editora:</label>
        <input type="text" id="editora" name="editora">
        <br><br>
        <label>Ano Publicação</label>
        <input type="date" id="ano_publicacao" name="ano_publicacao" step="0.01" min="0" max="99999.99">
        <br><br>
        <label>Categoria:</label>
        <input type="text" id="categoria" name="categoria">
        <br><br>
        <button type="submit">Cadastrar</button>
    </form>
    <div id="message"></div>

    <script src="criarInformacaoLivro.js"></script>
</body>

</html>
